name: Materialize initial source

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/source.part*.b64'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PowerShell source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          cat bootstrap/source.part00.b64 bootstrap/source.part01.b64 bootstrap/source.part02.b64 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > src/Start-MECMApplicationIntakeWorkbench.ps1
          test -s src/Start-MECMApplicationIntakeWorkbench.ps1
          grep -q "AppVersion = '0.25.4'" src/Start-MECMApplicationIntakeWorkbench.ps1
      - name: Commit reconstructed source and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/materialize-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add sanitized v0.25.4 source" || exit 0
          git push
